[relay]
# The Gmail account that owns the Google Voice number (the ClaudePC Gmail).
gmail_address =
# 16-letter Gmail app password (myaccount.google.com/apppasswords). Spaces are fine.
gmail_app_password =
# Your own cell number. Texts from any other number are ignored.
my_cell_number =

# --- Optional settings ---
# Extra options for Claude Code. Add --chrome to let it drive Chrome.
claude_extra_args = --dangerously-skip-permissions
# Leave empty for the default model, or e.g. opus / sonnet
model =
chars_per_text = 600
max_texts_per_reply = 6
still_working_after_minutes = 5
job_timeout_minutes = 60
send_got_it = true
# Only accept texts Google really signed (protects against forged emails). Keep true.
require_google_signature = true
